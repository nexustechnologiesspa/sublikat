<!-- Barra de lectura: fija, 3 px, decorativa. Solo se muestra si el
     navegador soporta animaciones de scroll y no hay movimiento reducido. -->
<div class="od-progress" aria-hidden="true"></div>

  <!-- CABECERA -->
    
<header id="site-header" class="sticky top-0 z-50 w-full max-w-[1200px] mx-auto px-4 sm:px-6 pt-3 pb-3 od-header">
    <div class="bg-surface sticker-border sticker-shadow-md px-5 py-3.5 flex flex-wrap items-center justify-between gap-4">

      <!-- LOGO -->
      <a href="#" class="flex items-center gap-3 group focus:outline-none focus:ring-2 focus:ring-[var(--line)] rounded-lg">
        <!-- SVG Gato Sublikat con tinta y delantal -->
        <div class="w-11 h-11 bg-awning sticker-border flex items-center justify-center sticker-shadow-sm flex-shrink-0">
          <svg class="w-7 h-7 tx-ink" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <!-- Orejas -->
            <polygon points="6,12 9,4 14,8" fill="#f3f1f8" />
            <polygon points="26,12 23,4 18,8" fill="#f3f1f8" />
            <!-- Cabeza -->
            <path d="M6 13C6 21 10 24 16 24C22 24 26 21 26 13C26 11 25 9 24 8C20 9.5 12 9.5 8 8C7 9 6 11 6 13Z" fill="#ffffff" />
            <!-- Ojos felices -->
            <path d="M10 14Q12 11 14 14" stroke-width="2.5" />
            <path d="M18 14Q20 11 22 14" stroke-width="2.5" />
            <!-- Nariz y hocico -->
            <polygon points="15,17 17,17 16,18.5" fill="#413f4b" stroke="none" />
            <path d="M14 19Q16 21 18 19" />
            <!-- Bigotes -->
            <line x1="7" y1="16" x2="4" y2="15" />
            <line x1="7" y1="18" x2="4" y2="19" />
            <line x1="25" y1="16" x2="28" y2="15" />
            <line x1="25" y1="18" x2="28" y2="19" />
          </svg>
        </div>
        <div>
          <span class="font-display text-3xl leading-none tx-ink block">Sublikat</span>
          <span class="text-[11px] font-extrabold uppercase tracking-widest tx-muted block -mt-0.5">Taller de estampados</span>
        </div>
      </a>

      <!-- NAVEGACIÓN -->
      <nav class="hidden md:flex items-center gap-7 tx-ink font-bold text-sm tracking-wide">
        <a href="#tienda" class="hover-tx-accent transition-colors py-1.5 focus:outline-none focus:underline">Tienda</a>
        <a href="#proceso" class="hover-tx-accent transition-colors py-1.5 focus:outline-none focus:underline">Cómo funciona</a>
        <a href="#resenas" class="hover-tx-accent transition-colors py-1.5 focus:outline-none focus:underline">Compromisos</a>
        <a href="#contacto" class="hover-tx-accent transition-colors py-1.5 focus:outline-none focus:underline">Contacto</a>
      </nav>

            <!-- CONMUTADOR DE MODO CLARO / OSCURO -->
      <button type="button" id="theme-toggle"
              class="h-[44px] w-[44px] bg-surface bd-ink tx-ink sticker-border sticker-shadow-sm flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-[var(--focus)] transition-transform hover:-translate-y-[2px] active:translate-y-[1px]"
              aria-pressed="false" aria-label="Cambiar a modo oscuro" title="Cambiar a modo oscuro">
        <span class="od-tema-etiqueta" aria-hidden="true">Modo oscuro</span>
        <svg data-icon="sol" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2.6v2M12 19.4v2M2.6 12h2M19.4 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/>
        </svg>
        <svg data-icon="luna" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.2 14.8A8.6 8.6 0 019.2 3.8a8.6 8.6 0 1011 11z"/>
        </svg>
      </button>


      <button type="button" id="menu-btn" class="md:hidden h-[44px] w-[44px] bg-surface tx-ink sticker-border sticker-shadow-sm flex items-center justify-center" aria-expanded="false" aria-controls="menu-movil" aria-label="Abrir menú">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <nav id="menu-movil" class="menu-movil basis-full w-full" aria-label="Menú móvil" hidden>
        <a href="#tienda">Tienda</a><a href="#proceso">Cómo funciona</a><a href="#resenas">Compromisos</a><a href="#contacto">Contacto</a>
        <!-- Hueco del conmutador de tema: en móvil `iniciarTemaEnMenu` muda
             aquí `#theme-toggle` y lo devuelve a la barra en escritorio. -->
        <div class="menu-movil__tema" id="menu-tema" hidden></div>
      </nav>
</div>
  </header>
